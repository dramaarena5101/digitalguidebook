<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREVIEW INSTAN | Drama Arena 5101</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0A0A0A; color: #E8E8E8; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-bebas { font-family: 'Bebas Neue', cursive; }
        .font-syne { font-family: 'Syne', sans-serif; }
        .orange-glow { text-shadow: 0 0 20px rgba(255,107,0,0.5); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #FF6B00; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Hero = () => (
            <section className="relative min-h-screen flex flex-col items-center justify-center text-center px-6 overflow-hidden">
                {/* Grid Background Mockup */}
                <div className="absolute inset-0 opacity-20 pointer-events-none" 
                     style={{ backgroundImage: 'radial-gradient(#FF6B00 0.5px, transparent 0.5px)', backgroundSize: '30px 30px' }}>
                </div>
                
                <div className="relative z-10">
                    <div className="inline-block px-4 py-1 rounded-full border border-orange-500 text-orange-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-8">
                        Digital Guidebook
                    </div>
                    
                    <h1 className="font-bebas text-7xl md:text-9xl text-orange-500 leading-none tracking-wider mb-4 animate-float orange-glow">
                        DRAMA ARENA
                    </h1>
                    <h2 className="font-bebas text-4xl md:text-6xl tracking-[0.4em] mb-8">
                        FIVE A HUNDRED ONE
                    </h2>
                    
                    <p className="max-w-xl mx-auto text-gray-500 text-sm tracking-widest uppercase mb-12">
                        "Nyalakan Api Kebersamaan, Wujudkan Idealisme Kehidupan"
                    </p>
                    
                    <div className="flex flex-wrap justify-center gap-4">
                        <button className="px-8 py-3 bg-orange-500 text-black font-bold rounded-full hover:scale-105 transition-transform shadow-xl shadow-orange-500/20">
                            Lihat Penampilan
                        </button>
                        <button className="px-8 py-3 border border-orange-500 text-orange-500 font-bold rounded-full hover:bg-orange-500/10 transition-all">
                            Tentang Acara
                        </button>
                    </div>
                </div>
            </section>
        );

        const Categories = () => {
            const cats = [
                { name: "Seni Musik", icon: "🎵", count: 8 },
                { name: "Seni Tari", icon: "💃", count: 11 },
                { name: "Seni Theater", icon: "🎭", count: 6 },
                { name: "Seni Bahasa", icon: "📖", count: 3 }
            ];
            return (
                <section className="py-24 px-6 max-w-7xl mx-auto">
                    <h2 className="font-bebas text-5xl mb-12 border-l-4 border-orange-500 pl-6">KATEGORI SENI</h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        {cats.map(c => (
                            <div key={c.name} className="p-8 bg-[#111] border border-white/5 rounded-2xl hover:border-orange-500/50 transition-all group">
                                <div className="text-4xl mb-6 group-hover:scale-110 transition-transform inline-block">{c.icon}</div>
                                <h3 className="font-syne text-xl mb-2">{c.name}</h3>
                                <p className="text-gray-500 text-xs tracking-widest uppercase">{c.count} Penampilan</p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const App = () => (
            <div>
                <nav className="fixed top-0 left-0 right-0 z-50 p-6 flex justify-between items-center bg-black/50 backdrop-blur-md border-b border-white/5">
                    <div className="flex items-center gap-2">
                        <div className="w-8 h-8 bg-orange-500 rounded flex items-center justify-center font-bold text-black">DA</div>
                        <span className="font-bebas text-xl">5101</span>
                    </div>
                    <div className="hidden md:flex gap-8 text-[10px] font-bold tracking-widest uppercase text-gray-400">
                        <a href="#" className="hover:text-orange-500 transition-colors">Home</a>
                        <a href="#" className="hover:text-orange-500 transition-colors">About</a>
                        <a href="#" className="hover:text-orange-500 transition-colors">Performances</a>
                        <a href="#" className="hover:text-orange-500 transition-colors">Timeline</a>
                    </div>
                </nav>
                <Hero />
                <Categories />
                <footer className="py-20 text-center border-t border-white/5 bg-[#050505]">
                    <p className="text-[10px] tracking-[0.5em] uppercase text-gray-600 mb-4">Drama Arena 5101 © 2026</p>
                    <p className="font-bebas text-orange-500 text-xl">IT'S TIME TO SHINE</p>
                </footer>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
